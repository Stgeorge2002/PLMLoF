# LoF head (ESM2-35M frozen, cached embeddings).
training:
  max_epochs: 40
  learning_rate: 3.0e-4
  weight_decay: 0.01
  batch_size: 256
  gradient_accumulation_steps: 1
  warmup_ratio: 0.2
  early_stopping_patience: 8
  mixed_precision: "bf16"
  ensemble_seeds: [0, 1, 2, 3, 4]
  seed: 42
