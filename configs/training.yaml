# Stage-1 heads only (ESM2 frozen, cached embeddings).
# Recipe from the 2-seed sweep: LoF long_train, MDG equal RankNet+SmoothL1.
training:
  max_epochs: 40
  learning_rate: 3.0e-4
  weight_decay: 0.01
  batch_size: 256
  gradient_accumulation_steps: 1
  warmup_ratio: 0.2
  early_stopping_patience: 8
  mixed_precision: "bf16"
  gof_threshold: 0.90
  rank_loss_weight: 0.5
  regression_loss_weight: 0.5
  mlof_proteins_per_batch: 4
  ensemble_seeds: [0, 1, 2, 3, 4]
  seed: 42
