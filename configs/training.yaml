# Stage-1 heads only (ESM2 frozen, cached embeddings)
training:
  max_epochs: 20
  learning_rate: 3.0e-4
  weight_decay: 0.01
  batch_size: 256
  gradient_accumulation_steps: 1
  warmup_ratio: 0.2
  early_stopping_patience: 5
  mixed_precision: "bf16"
  gof_threshold: 0.90
  rank_loss_weight: 0.7
  regression_loss_weight: 0.3
  mlof_proteins_per_batch: 4
  ensemble_seeds: [0, 1, 2, 3, 4]
  seed: 42
