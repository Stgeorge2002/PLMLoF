# RunPod production training config — optimised for NVIDIA A40 (48 GB, Ampere)
training:
  # Stage 1: Classification head only (ESM2 frozen)
  stage1:
    max_epochs: 200            # Extended — model still improving at epoch 100
    learning_rate: 6.0e-5      # Modest 20% increase from proven 5e-5 baseline
    weight_decay: 0.01
    batch_size: 64             # A40 48 GB — cached embeddings, no ESM2 in memory
    gradient_accumulation_steps: 4   # effective batch = 256; reduces epoch-to-epoch val variance
    warmup_ratio: 0.10
    scheduler: "cosine"
    # Curriculum learning: start with high-|z| variants, progressively add near-zero
    curriculum_z_thresh: 0.0     # DISABLED — WT variants have near-zero z-score and are excluded by curriculum
    curriculum_epochs: 0         # Unused when z_thresh=0.0

  # Stage 2: LoRA fine-tuning
  stage2:
    max_epochs: 5
    learning_rate: 5.0e-5
    weight_decay: 0.01
    batch_size: 32          # A40 48 GB — ESM2-650M (~2.5 GB) + LoRA + activations fits at 32
    gradient_accumulation_steps: 2
    warmup_ratio: 0.05
    scheduler: "cosine"

  # General
  early_stopping_patience: 15
  metric_for_best_model: "macro_f1"
  mixed_precision: "bf16"     # A40 is Ampere (compute cap 8.6) — bf16 is native and faster than fp16
  max_seq_length: 1024
  seed: 42

  # Multi-task regression (DMS z-score prediction)
  regression_weight: 0.0       # Disabled — remove regression head in future if not needed
  regression_warmup_epochs: 3
  focal_gamma: 2.0             # Keep proven value — higher values caused instability
  label_smoothing: 0.05        # Keep proven value — works well with focal loss

  # Training data is balanced (100K per class) — no class weighting needed.
  # Focal loss handles hard examples without introducing class bias.
  class_weights: null          # Balanced dataset — equal treatment for all classes

  # Logging
  log_every_n_steps: 25
  eval_every_n_steps: 200
  save_every_n_steps: 500

  # Paths (RunPod persistent storage)
  output_dir: "outputs/production/"
  checkpoint_dir: "outputs/production/checkpoints/"
