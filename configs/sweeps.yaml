# MDG feature ablations on frozen ESM2 caches. LoF is done; this screen is
# protein_test transfer (taxon weight, ESM log-odds, Pfam bits, Hamming-2).
# Screen with 2 seeds; retrain the winner with 0-4 after the scoreboard.
#
# Embeddings must already include 8-dim site_chem (llr + domain), Hamming-2
# windows, and taxon. Rebuild mlof parquet on the laptop, rsync, then
# `bash isambard/submit.sh embed` before this sweep.
#
# MDG selection = within-gene Spearman on test sites of seen proteins,
# plus protein_test (unseen proteins). Taxon slices are diagnostic only.

seeds: [0, 1]

lof: []

mlof:
  - name: baseline
    note: all new site features (llr + Pfam + Hamming-2)
  - name: no_logodds
    ablate_logodds: true
    note: drop unmasked ESM2 log-odds
  - name: no_domain
    ablate_domain: true
    note: drop Pfam in-domain / extra-domain bits
  - name: chem_only
    ablate_logodds: true
    ablate_domain: true
    note: BLOSUM chemistry only (old 5-dim)
  - name: prokaryote_x3
    prokaryote_weight: 3.0
    note: up-weight prokaryote rows, keep eukaryotes
  - name: prokaryote_only
    prokaryote_only: true
    note: train on prokaryote proteins only
  - name: singles_only
    drop_multi: true
    note: drop Hamming-2 from train; eval still maxes sites
