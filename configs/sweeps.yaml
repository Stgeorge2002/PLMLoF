# Head-only ablations on frozen ESM2 caches. No re-embed, no GoF.
# Screen with 2 seeds; retrain the winner with 0-4 after the scoreboard.
#
# LoF selection = wreck AUROC. MDG selection = within-gene Spearman
# (test sites of seen proteins) plus protein_test (unseen proteins).

seeds: [0, 1]

lof:
  - name: baseline
    note: current training.yaml (sure wrecks stay in train)
  - name: no_sure_wrecks
    drop_sure_wrecks: true
    note: drop sure wrecks so the net cannot learn length
  - name: lr_1e4
    learning_rate: 1.0e-4
  - name: wide_head
    head_hidden: 256
    dropout: 0.1
  - name: long_train
    max_epochs: 40
    patience: 8

mlof:
  - name: baseline
    note: rank 0.7 + SmoothL1 0.3, 4 proteins/batch
  - name: rank_only
    rank_loss_weight: 1.0
    regression_loss_weight: 0.0
  - name: balanced
    rank_loss_weight: 0.5
    regression_loss_weight: 0.5
  - name: dense_genes
    mlof_proteins_per_batch: 8
  - name: rank_only_dense
    rank_loss_weight: 1.0
    regression_loss_weight: 0.0
    mlof_proteins_per_batch: 8
  - name: lr_1e4
    learning_rate: 1.0e-4
  - name: long_train
    max_epochs: 40
    patience: 8
