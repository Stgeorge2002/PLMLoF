[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plmlof"
version = "1.0.0"
description = "Graded bacterial LoF score plus conservative growth/AMR GoF flags"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.6,<3.0",
    "transformers>=4.36,<4.55",
    "biopython>=1.81",
    "huggingface_hub>=0.23",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "tqdm>=4.65",
]

[project.optional-dependencies]
tracking = ["wandb>=0.15"]
hmmer = ["pyhmmer>=0.10.4"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
include = ["plmlof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
